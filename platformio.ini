; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs = pico32
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
build_flags =
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
monitor_speed = 115200

; pico32 board = the deployed battery loggers (accuklein / accugroot).
;
; min_spiffs (1.9MB app slots, ~192KB LittleFS): the v3 firmware is ~92% of a
; default.csv 1.25MB app slot, too tight to leave. The FS drop is fine here --
; at the deployed config (interval 600s, rawRetentionDays 14) the loggers sit at
; ~53KB steady-state and grow only ~10KB/year of daily min/max records, so ~192KB
; lasts a decade-plus. The finite-storage problem still needs a real fix in the
; Python tool -- see cwi-dis/iotsaDataLogger#6.
;
; This replaces the old committed partitions.csv (default.csv minus the coredump
; partition). The deployed devices pick up min_spiffs on their next serial reflash
; (backup -> esptool full flash -> restore).
[env:pico32]
extends = pico32
board_build.partitions = min_spiffs.csv
